<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'"><title>Home controls</title><link rel="stylesheet" href="/style.css?v=021"><script src="/app.js?v=021" defer></script></head>
<body><main aria-label="Household controls"><p id="message" class="notice" role="status" aria-live="polite"></p>
<form id="login" hidden><h1>Sign in</h1><label>Username<input id="username" autocomplete="username" required maxlength="32"></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><label class="remember"><input id="remember" type="checkbox" checked> Remember this device</label><button type="submit">Sign in</button><p id="login-message" class="status" role="status" aria-live="polite"></p></form>
<section id="controls" class="grid" aria-label="Devices and scheduler" hidden></section>
<footer><button id="logout" class="text-button" hidden>Sign out</button><a href="/disclaimer.txt">Disclaimer</a></footer></main></body></html>
