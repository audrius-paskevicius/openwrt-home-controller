<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'"><title>Home Controller</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><main><header><div><p class="eyebrow">YOUR HOME</p><h1>Home Controller</h1></div><button id="logout" class="quiet" hidden>Sign out</button></header>
<p id="message" role="status" aria-live="polite"></p>
<form id="login"><h2>Welcome home</h2><p>Sign in to use your home controls.</p><label>Username<input id="username" autocomplete="username" required maxlength="32"></label><label>Password<input id="password" type="password" autocomplete="current-password" required maxlength="256"></label><label class="remember"><input id="remember" type="checkbox" checked> Remember this device</label><button type="submit">Sign in</button></form>
<section id="controls" hidden><div id="groups"></div><div id="devices" class="grid"></div><p class="note">Commands are sent by radio. Blind position is not reported. Your next scheduled action remains active.</p></section>
<footer>Home Controller <span id="version">0.1</span> · Local control · <a href="/disclaimer.txt">Disclaimer</a></footer></main></body></html>
